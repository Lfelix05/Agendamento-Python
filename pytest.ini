[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    unit: testes unitários das regras de negócio (rápidos, sem banco nem HTTP)
    api: testes dos endpoints com banco em memória
    e2e: testes ponta a ponta no navegador (Playwright)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
